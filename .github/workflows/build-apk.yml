# Builds an installable APK on GitHub's servers — no Android Studio needed.
# Push this project to your own GitHub repository, open the "Actions" tab,
# run "Build APK", then download the APK from the run's "Artifacts" section.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the retired "tools" package,
          # which no longer exists and makes sdkmanager fail
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: openlauncher-custom-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
