# Builds an installable APK on GitHub's servers — no Android Studio needed.
# Push this project to your own GitHub repository, open the "Actions" tab,
# run "Build APK", then download the APK from the run's "Artifacts" section.
name: Build APK

on:
  push:
    paths-ignore:
      - 'carhome/**'
      - '.github/workflows/build-carhome.yml'
      - '.github/workflows/carhome-*.yml'
      - '.github/workflows/osm-cameras.yml'
      - '.github/dependabot.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write   # lets the job attach the APK to a (private) release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The action's default list includes the retired "tools" package,
          # which no longer exists and makes sdkmanager fail
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openlauncher-custom-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Also publish the APK as a release so it can be downloaded as a plain
      # .apk (artifacts always arrive zipped)
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" openlauncher-custom.apk
          gh release create "build-${{ github.run_number }}" openlauncher-custom.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Automatic build of ${{ github.sha }}" \
            --prerelease
