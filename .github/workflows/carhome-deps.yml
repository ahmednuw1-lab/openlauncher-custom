# Writes the checksum list of every library and build tool CarHome's build
# downloads (carhome/gradle/verification-metadata.xml). With that file in the
# repository, Gradle refuses any download whose content differs from what was
# recorded here, so a tampered library can't slip into a build.
#
# Run it by hand (Actions tab) after changing a library version, download the
# "carhome-verification-metadata" artifact and commit the file it contains.
name: CarHome dependency checksums

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/carhome-deps.yml'

permissions:
  contents: read

jobs:
  checksums:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carhome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true

      # Every task the other workflows run, so every download they need is recorded
      - name: Record checksums
        run: |
          chmod +x gradlew
          rm -f gradle/verification-metadata.xml
          ./gradlew --no-daemon --write-verification-metadata sha256 testDebugUnitTest assembleRelease assembleDebug
          grep -c '<sha256' gradle/verification-metadata.xml

      # Also in the log (compressed, as text), for when the artifact can't be downloaded
      - name: Print the file
        run: |
          echo "-----BEGIN METADATA-----"
          gzip -9 -c gradle/verification-metadata.xml | base64 -w 100
          echo "-----END METADATA-----"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carhome-verification-metadata
          path: carhome/gradle/verification-metadata.xml
          if-no-files-found: error
