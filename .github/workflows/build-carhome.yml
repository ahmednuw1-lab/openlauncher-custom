# Builds the CarHome launcher (carhome/ folder) and publishes carhome.apk
# as a private release.
name: Build CarHome

on:
  push:
    paths:
      - 'carhome/**'
      - '.github/workflows/build-carhome.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carhome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carhome-test-report
          path: carhome/app/build/reports/tests/
          if-no-files-found: ignore

      # The release build: not debuggable (faster on the box, private data can't be
      # read over adb). Same signing key, so it installs over the earlier builds.
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" carhome.apk
          gh release create "carhome-${{ github.run_number }}" carhome.apk \
            --target "${{ github.sha }}" \
            --title "CarHome build ${{ github.run_number }}" \
            --notes "Automatic build of ${{ github.sha }}" \
            --prerelease
