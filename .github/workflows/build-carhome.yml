# Builds the CarHome launcher (carhome/ folder) and publishes carhome.apk
# as a release. The signing key comes from the repository secrets
# CARHOME_KEYSTORE_B64 and CARHOME_KEYSTORE_PASSWORD; it is never in the code.
name: Build CarHome

on:
  push:
    paths:
      - 'carhome/**'
      - '.github/workflows/build-carhome.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carhome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carhome-test-report
          path: carhome/app/build/reports/tests/
          if-no-files-found: ignore

      # The release build: not debuggable (faster on the box, private data can't be
      # read over adb). Same signing key, so it installs over the earlier builds.
      - name: Load the signing key
        env:
          KEY_B64: ${{ secrets.CARHOME_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::error::Add the CARHOME_KEYSTORE_B64 and CARHOME_KEYSTORE_PASSWORD repository secrets"
            exit 1
          fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/carhome.p12"
          echo "CARHOME_KEYSTORE=$RUNNER_TEMP/carhome.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          CARHOME_KEYSTORE_PASSWORD: ${{ secrets.CARHOME_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          # Refuse to publish an unsigned APK
          ls app/build/outputs/apk/release/*.apk | grep -v unsigned >/dev/null

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/carhome.p12"

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" carhome.apk
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          # Marked as the latest release, so this link always gives the newest CarHome:
          # https://github.com/${{ github.repository }}/releases/latest/download/carhome.apk
          gh release create "carhome-${{ github.run_number }}" carhome.apk \
            --target "${{ github.sha }}" \
            --title "CarHome $VER (build ${{ github.run_number }})" \
            --notes "$(printf 'CarHome %s. Install carhome.apk over your current CarHome; your settings are kept.\n\nversionCode: %s' "$VER" "$CODE")" \
            --latest
