# Builds the CarHome launcher (carhome/ folder) and publishes carhome.apk
# as a release.
#
# Two jobs, so the signing key is never near the code that gets built:
#   build  - runs the tests and Gradle. It has NO access to the signing key
#            and cannot write to the repository. It hands over an unsigned APK.
#   sign   - only for the main branch. It does not check out or run any code
#            from the repository: it signs the APK with Android's own apksigner
#            and publishes the release. The key comes from the repository
#            secrets CARHOME_KEYSTORE_B64 and CARHOME_KEYSTORE_PASSWORD.
#
# The sign job runs in the "release" environment. To approve every release by
# hand, add yourself as a required reviewer of that environment:
#   Settings > Environments > release > Required reviewers
#
# Every action is pinned to an exact commit, so a changed tag can't swap in
# different code.
name: Build CarHome

on:
  push:
    paths:
      - 'carhome/**'
      - '.github/workflows/build-carhome.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carhome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carhome-test-report
          path: carhome/app/build/reports/tests/
          if-no-files-found: ignore

      # The release build: not debuggable (faster on the box, private data can't be
      # read over adb). Built WITHOUT the key; the sign job signs it.
      - name: Build unsigned release APK
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../handover
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../handover/carhome-unsigned.apk
          grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts > ../handover/version-name.txt
          grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts > ../handover/version-code.txt
          cp app/src/main/assets/whats-new.md ../handover/whats-new.md
          sha256sum ../handover/carhome-unsigned.apk

      - name: Hand the unsigned APK to the sign job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carhome-unsigned
          path: handover/
          if-no-files-found: error
          retention-days: 7

  # Only builds of main are signed and published; other branches just build and test
  sign:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      # No checkout: nothing from the repository runs in this job
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: carhome-unsigned
          path: handover

      - name: Sign with the CarHome key
        env:
          KEY_B64: ${{ secrets.CARHOME_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.CARHOME_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Add the CARHOME_KEYSTORE_B64 and CARHOME_KEYSTORE_PASSWORD repository secrets"
            exit 1
          fi
          # Android's own signing tools, as installed on the runner (not from the repository)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          KEY="$RUNNER_TEMP/carhome.p12"
          trap 'rm -f "$KEY"' EXIT
          echo "$KEY_B64" | base64 -d > "$KEY"
          "$BT/zipalign" -f -p 4 handover/carhome-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$KEY" --ks-type pkcs12 --ks-key-alias carhome \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out carhome.apk aligned.apk
          # Refuse to publish anything that isn't properly signed
          "$BT/apksigner" verify --print-certs carhome.apk | grep -E 'Signer #1 certificate (DN|SHA-256)'
          sha256sum carhome.apk

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(cat handover/version-name.txt)
          CODE=$(cat handover/version-code.txt)
          # Marked as the latest release, so this link always gives the newest CarHome:
          # https://github.com/${{ github.repository }}/releases/latest/download/carhome.apk
          gh release create "carhome-${{ github.run_number }}" carhome.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "CarHome $VER (build ${{ github.run_number }})" \
            --notes "$(printf '%s\n\nInstall carhome.apk over your current CarHome; your settings are kept.\n\nversionCode: %s' "$(cat handover/whats-new.md)" "$CODE")" \
            --latest
