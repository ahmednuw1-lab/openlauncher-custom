# Runs CarHome in an Android emulator (car-screen size) and publishes real
# screenshots as a private release. Started by hand from the Actions tab.
name: CarHome screenshots

on:
  workflow_dispatch:
    inputs:
      set:
        description: 'new = what is new in this version, all = every screen'
        default: 'new'
  push:
    paths:
      - 'carhome/tools/screenshots.sh'
      - 'carhome/tools/shots-new.sh'
      - '.github/workflows/carhome-screenshots.yml'

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: carhome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # The emulator's data disk needs several GB; the runner image ships large
      # toolchains we don't use
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in emulator and capture screens
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 3000M
          working-directory: carhome
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: SHOTS=${{ inputs.set == 'all' && 'all' || 'new' }} bash tools/screenshots.sh

      - name: Publish screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "carhome-shots-${{ github.run_number }}" $(find shots -type f -size +0c | sort) \
            --title "CarHome screenshots ${{ github.run_number }}" \
            --notes "Emulator screenshots at 1280x720" \
            --prerelease
